# This is a basic list that specifies files for which the prototypes inside of them will be made abstract.
# This supports all prototype kinds and is intended to allow servers to remove prototypes in a relatively clean way.
# This method does not break inheritance, but you will still have to remove usages.

# e.g., you can specify both directories and specific files by adding lines like:
#
# - /Prototypes/Guidebook
# - /Prototypes/Catalog/uplink_catalog.yml

# SCP-Foundation-start
- /Prototypes/audio.yml
- /Prototypes/Entities/Mobs/Customization/Markings/cat_parts.yml
- /Prototypes/Entities/Mobs/Customization/Markings/ears.yml
- /Prototypes/Roles/Antags/paradoxClone.yml
- /Prototypes/Palettes/advanced.yml
- /Prototypes/Palettes/departamental.yml
- /Prototypes/Roles/Jobs/departments.yml
- /Prototypes/Recipes/Crafting/artifact.yml
- /Prototypes/Recipes/Crafting/bots.yml
- /Prototypes/Recipes/Crafting/potato.yml
- /Prototypes/Recipes/Crafting/toys.yml
- /Prototypes/Recipes/Crafting/tiles.yml
- /Prototypes/Recipes/Crafting/web.yml
- /Prototypes/Recipes/Construction/fun.yml
- /Prototypes/Recipes/Construction/utilities.yml
- /Prototypes/Recipes/Construction/structures.yml
- /Prototypes/Recipes/Construction/lighting.yml
- /Prototypes/Recipes/Construction/web.yml
# SCP-Foundation-end
