- type: gameMap
  id: SCPFourLevels-test
  mapName: Dev
  mapPath: /Maps/_SCP/SCPDev/SCPDev0.yml
  mapsAbove:
  # Cycle stairs
  - /Maps/_SCP/SCPDev/SCPDev1.yml
  - /Maps/_SCP/SCPDev/SCPDev2.yml
  - /Maps/_SCP/SCPDev/SCPDev1.yml
  - /Maps/_SCP/SCPDev/SCPDev2.yml
  # Upper level
  - /Maps/_SCP/SCPDev/SCPDev3.yml
  zLevelsComponentOverrides:
    - type: MapAtmosphere
      space: False
      mixture:
        volume: 2500
        immutable: True
        temperature: 293.15
        moles:
          Oxygen: 21.824879
          Nitrogen: 82.10312
    - type: Parallax
      parallax: Dirt
    - type: SunShadowCycle
    - type: LightCycle
      originalColor: "#fff475"
    - type: SunShadow
    - type: MapLight
      ambientLightColor: "#efff75"
  minPlayers: 0
  stations:
    Dev:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Dev"
        - type: StationJobs
          availableJobs:
            Captain: [ -1, -1 ]
