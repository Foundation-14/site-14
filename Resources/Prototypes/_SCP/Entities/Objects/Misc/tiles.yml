- type: entity
  parent: BaseItem
  id: SCPFloorTileItemBase
  description: These could work as a pretty decent throwing weapon.
  abstract: true
  suffix: SCPStructure
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _SCP/Objects/Tiles/tile.rsi
  - type: Item
    sprite: _SCP/Objects/Tiles/tile.rsi
    size: Normal
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Stack
    count: 1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 5

