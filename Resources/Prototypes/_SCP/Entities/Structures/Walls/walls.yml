- type: entity
  abstract: true
  parent: BaseStructure
  id: SCPBaseStructureWall
  name: basewall
  description: Keeps the air in and the greytide out.
  suffix: SCPStructure
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
    - type: Anchorable
      flags:
      - Anchorable
    - type: Rotatable
    - type: RangedDamageSound
      soundGroups:
        Brute:
          collection:
            MetalBulletImpact
      soundTypes:
        Heat:
          collection:
            MetalLaserImpact
    - type: ExaminableDamage
      messages: WindowMessages
    - type: Tag
      tags:
      - Wall
    - type: IsRoof
    - type: Sprite
      drawdepth: Walls
    - type: Icon
      state: full
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: StructuralMetallic
    - type: Physics
      bodyType: Static
    - type: StaticPrice
      price: 75
    - type: BlockWeather
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 250
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel1:
                  min: 1
                  max: 3
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
    - type: Repairable

- type: entity
  abstract: true
  parent: SCPBaseStructureWall
  id: SCPBaseWall
  components:
    - type: Occluder
    - type: Airtight
    - type: RadiationBlocker
      resistance: 2
    - type: SunShadowCast
    - type: PlacementReplacement
      key: walls
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
          mask:
          - FullTileMask
          layer:
          - WallLayer
          density: 1000

# Stripe region
- type: entity
  parent: SCPBaseStructureWall
  id: SCPStripeWhite
  name: white stripe
  components:
  - type: Sprite
    sprite: _SCP/Structures/Walls/stripe.rsi
    color: "#c0c0c0"
    drawdepth: WallTops
  - type: Icon
    sprite: _SCP/Structures/Walls/stripe.rsi
    color: "#c0c0c0"
  - type: IconSmooth
    key: walls
    base: stripe
  - type: Tag
    tags:
      - HideContextMenu
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

