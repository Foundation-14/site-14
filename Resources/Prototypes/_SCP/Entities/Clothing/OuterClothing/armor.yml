- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing ]
  id: SCPClothingOuterArmorLight
  name: light vest
  description: A standard Type I armored vest that provides decent protection against most types of damage.
  categories: [ ForkFiltered ]
  components:
  - type: Sprite
    sprite: _SCP/Clothing/OuterClothing/Armor/light_armor.rsi
  - type: Clothing
    sprite: _SCP/Clothing/OuterClothing/Armor/light_armor.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.9

