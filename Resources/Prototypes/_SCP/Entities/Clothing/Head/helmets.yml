- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseFoldable]
  id: SCPClothingHeadHelmetMedium
  name: medium helmet
  description: Standard security gear. Protects the head from impacts.
  categories: [ ForkFiltered ]
  components:
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: open
    foldedSlots:
    - HEAD
    unfoldedSlots:
    - HEAD
    foldedHideLayers: []
    unfoldedHideLayers: []
  - type: Sprite
    sprite: _SCP/Clothing/Head/Helmets/medium_helmet.rsi
    layers:
    - state: icon_open
      map: [ "unfoldedLayer" ]
      visible: false
    - state: icon
      map: ["foldedLayer"]
  - type: Clothing
    sprite: _SCP/Clothing/Head/Helmets/medium_helmet.rsi
  - type: HideLayerClothing
    layers:
      Hair: HEAD
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

