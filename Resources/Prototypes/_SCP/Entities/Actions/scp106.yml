- type: entity
  parent: BaseAction
  id: ActionSCP106Teleport
  name: Teleport
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: _SCP/Actions/scp-106.rsi
    layers:
    - state: portal_exit_action
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:SCP106TeleportEvent

