- type: entity
  parent: BaseMentalAction
  id: CEActionZLevelUp
  name: Move up
  description: Move up one Z-Level
  components:
  - type: Sprite
    sprite: _SCP/Actions/misc.rsi
    layers:
    - state: up
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEZLevelActionUp

- type: entity
  parent: BaseMentalAction
  id: CEActionZLevelDown
  name: Move down
  description: Move down one Z-Level
  components:
  - type: Sprite
    sprite: _SCP/Actions/misc.rsi
    layers:
    - state: down
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CEZLevelActionDown

- type: entity
  parent: BaseToggleAction
  id: CEActionToggleLookUp
  name: Look up
  description: You lift your head and look up at the sky.
  components:
  - type: Action
    checkCanInteract: false
  - type: Sprite
    sprite: _SCP/Actions/misc.rsi
    layers:
    - state: eye_up
      map: ["enum.ActionVisuals.Icon"]
    - state: eye_down
      map: ["enum.ActionVisuals.IconToggled"]
      visible: false
