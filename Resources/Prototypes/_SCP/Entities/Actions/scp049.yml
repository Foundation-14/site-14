- type: entity
  id: ActionScp049StopLife
  categories: [ HideSpawnMenu ]
  name: Stop Life
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _SCP/Actions/scp-049.rsi
      state: kill
    itemIconStyle: NoItem
    priority: 12
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:Scp049StopLifeAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState

