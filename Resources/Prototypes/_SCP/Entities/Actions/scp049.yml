- type: entity
  parent: BaseAction
  id: ActionScp049StopLife
  categories: [ HideSpawnMenu ]
  name: Stop Life
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    priority: 12
  - type: Sprite
    sprite: _SCP/Actions/scp-049.rsi
    layers:
    - state: kill
      map: ["enum.ActionVisuals.Icon"]
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    event: !type:Scp049StopLifeAction
    canTargetSelf: false
    whitelist:
      components:
      - MobState

